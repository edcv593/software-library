version: "3.8"

services:
  software-library:
    image: edcv593/software-library:latest
    container_name: software-library
    restart: unless-stopped
    ports:
      - "8899:8899"
    volumes:
      # 软件仓库目录（只读：上传、配置都不写这里，可放心维护）
      - /tmp/zfsv3/nvme17/13040705017/data/共享数据:/data:ro
      # 应用数据目录（与软件仓库分开）：用户、配置、上传与下载留存的文件都在这里
      - /tmp/zfsv3/nvme17/13040705017/data/Docker/software-library:/app/data
    environment:
      - LIB_ROOT_DIR=/data
      - LIB_PORT=8899
      - LIB_DATA_DIR=/app/data
      - LIB_WATCH_INTERVAL=3600
